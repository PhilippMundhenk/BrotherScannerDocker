#
name: Tags - Create and publish a Docker image

# Build when a tag is created. A version tag vX.Y.Z publishes the image as
# vX.Y.Z, vX.Y, vX and, when it is the highest version in the repository,
# stable; a pre-release (vX.Y.Z-rc1) only as its exact tag; any other tag
# under its own name. `latest` stays the master build (publishMaster.yml).
on:
  push:
    tags:
      - "**"

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Tests gate the Docker build: if shellcheck or bats fail, no image is published.
jobs:
  tests:
    uses: ./.github/workflows/test.yml

  build-and-push-image:
    needs: tests
    runs-on: ubuntu-latest
    # Sets the permissions granted to the `GITHUB_TOKEN` for the actions in this job.
    permissions:
      contents: read
      packages: write
      #
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # every tag, to tell whether this one is the newest version
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `stable` only moves to the highest release version in the repository, so
      # a maintenance release of an older line (v1.1.2 after v2.0.0) does not take it.
      - name: Is this tag the newest release version?
        id: newest
        shell: bash
        run: |
          newest=$(git tag -l 'v[0-9]*' | grep -v -- '-' | sort -V | tail -1)
          if [[ "$GITHUB_REF_NAME" == "$newest" ]]; then stable=true; else stable=false; fi
          echo "newest release tag: $newest; this tag: $GITHUB_REF_NAME; stable=$stable"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # semver patterns apply to vX.Y.Z tags; the major and minor ones are skipped
          # for pre-releases by the action itself. A tag that is not a version keeps its name.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=stable,enable=${{ steps.newest.outputs.stable == 'true' }}
            type=ref,event=tag,enable=${{ !startsWith(github.ref_name, 'v') }}
          flavor: |
            latest=false
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see "[Usage](https://github.com/docker/build-push-action#usage)" in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
