name: Tests

# Runs standalone on pushes to non-master branches and is reusable
# (workflow_call) so the publish workflows gate their Docker builds on the
# same checks. PRs run it through the PR publish workflow, so there is no
# separate pull_request trigger (that would run everything twice).
on:
  push:
    branches-ignore:
      - master
  workflow_call:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: make lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run bats unit tests
        run: bats tests/unit

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest requests==2.32.3
      - name: Run Python unit tests
        run: pytest tests/python
