server.modules += ( "mod_rewrite" )

# Route everything that is not a real file to the PHP front controller.
# The first rule keeps the query string (lighttpd matches the whole request
# URI, so a plain "^/(.*)$" => "/index.php" would drop "?offset=..&limit=..").
url.rewrite-if-not-file = (
    "^/([^?]*)\?(.*)$" => "/index.php?$2",
    "^/(.*)$" => "/index.php"
)
