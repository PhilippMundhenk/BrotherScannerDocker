openapi: 3.0.3
info:
  title: BrotherScannerDocker API
  description: |
    REST API of the scanner container: start scans, follow them as jobs, and
    manage the scanned files. The web UI uses the same endpoints.

    Authentication: none by default. When the container runs with `API_TOKEN`,
    every request that starts a scan or changes a file must carry the token as
    `Authorization: Bearer <token>`, as an `X-API-Token` header, or as a
    `token` form/query field. Read-only endpoints stay open.
  version: 2.0.0
servers:
  - url: http://localhost:8080/api
    description: Container with WEBSERVER=true (PORT=8080)

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
    header:
      type: apiKey
      in: header
      name: X-API-Token
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          example: 400
        message:
          type: string
    Status:
      type: object
      properties:
        scan:
          type: boolean
          description: a scan is in progress
        waiting:
          type: boolean
          description: a front scan is waiting for rear pages
        ocr:
          type: boolean
          description: an OCR upload is running
        reachable:
          type: boolean
          nullable: true
          description: the device answered the last connection check (null when the check is disabled or stale)
        queue:
          type: object
          description: OCR queue (see OCR_QUEUE_DIR)
          properties:
            pending:
              type: integer
            in_progress:
              type: integer
            failed:
              type: integer
            holding:
              type: boolean
              description: the worker holds the next upload back because the scanner is busy
    DeviceStatus:
      type: object
      properties:
        device_ip:
          type: string
        reachable:
          type: boolean
          description: the device answered SNMP at all
        registered:
          type: boolean
          nullable: true
          description: the device currently lists a Scan-to-PC destination (the registration read back)
        model:
          type: string
          nullable: true
          example: MFC-L2700DW
        serial:
          type: string
          nullable: true
        firmware:
          type: string
          nullable: true
        display:
          type: string
          nullable: true
          description: first line of the front-panel display
        net_scanner_supported:
          type: boolean
          nullable: true
        net_scanner_enabled:
          type: boolean
          nullable: true
        scan_key_supported:
          type: boolean
          nullable: true
          description: the device supports the network Scan-to-PC key
        scan_key_enabled:
          type: boolean
          nullable: true
        checked:
          type: string
          description: when the device was asked (ISO 8601)
        cached:
          type: boolean
          description: the answer came from the cache (DEVICE_STATUS_CACHE_SECONDS)
    Job:
      type: object
      properties:
        job:
          type: string
          example: "2026-10-10-19-25-20"
          description: job id, also the base name of the resulting PDF
        action:
          type: string
          enum: [file, ocr, email, image]
        state:
          type: string
          enum: [queued, scanning, waiting_for_rear, scanning_rear, converting, done, failed]
        side:
          type: string
          enum: [front, rear]
        pages:
          type: integer
          description: pages scanned so far (front side)
        waiting_until:
          type: string
          description: when the front job will convert on its own (state waiting_for_rear)
        params:
          type: object
          description: per-job overrides (RESOLUTION, SCAN_MODE, SCAN_SOURCE) given at trigger time
        trigger:
          type: string
          enum: [button, api]
          description: who started the job, the Scan-to-PC button on the device or the REST API / web UI
        button:
          type: object
          description: for a button-started job, what the button daemon reported (openskey; Brother's brscan-skey reports nothing)
          properties:
            function:
              type: string
              enum: [file, email, image, ocr]
              description: the Scan-to-PC function pressed on the device
            seq:
              type: integer
              description: the device's per-press sequence number
            regid:
              type: integer
              description: the device's registration id of the function
            client:
              type: string
              description: this host's address as the device sees it, when reported
            params:
              type: object
              description: the per-press option fields P1..P4 as p1..p4 (0 means default; an MFC-L2700DW always sends 0)
        file:
          type: string
          description: PDF in /scans (state done)
        file_url:
          type: string
        file_exists:
          type: boolean
        ocr:
          type: string
          enum: [none, queued, pending, in_progress, failed, done]
          description: OCR copy state (queue position or done)
        ocr_file:
          type: string
        ocr_file_url:
          type: string
        error:
          type: string
          description: why the job failed (state failed)
        created:
          type: string
        updated:
          type: string
        url:
          type: string
    TriggerResponse:
      type: object
      properties:
        message:
          type: string
          example: Scan triggered
        target:
          type: string
        job:
          type: string
        status_url:
          type: string
        state:
          type: string
          description: only when the request waited for the script
    FileInfo:
      type: object
      properties:
        full_path:
          type: string
        file:
          type: string
        name:
          type: string
        name_clean:
          type: string
        dir:
          type: string
        date_from_name:
          type: string
        time_from_name:
          type: string
        fileCreationTime:
          type: integer
        fileModificationTime:
          type: integer
        date_from_file:
          type: string
        time_from_file:
          type: string
        extension:
          type: string
        mimetype:
          type: string
        size:
          type: integer

paths:
  /actions:
    get:
      summary: Available scan actions, their labels and the accepted parameters
      responses:
        '200':
          description: Actions and parameter schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_version:
                    type: integer
                    description: Incremented when the API changes incompatibly (integrations check this)
                  version:
                    type: string
                    description: Image version (tag, branch and commit, or dev)
                  device:
                    type: object
                    description: Name, model and address of the scanner; capabilities holds the mode, resolution and source options the device listed at startup, each with the device default
                    properties:
                      name:
                        type: string
                      model:
                        type: string
                      host:
                        type: string
                      capabilities:
                        type: object
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        target:
                          type: string
                        label:
                          type: string
                        enabled:
                          type: boolean
                        description:
                          type: string
                  parameters:
                    type: object
                  jobs:
                    type: object
                  authentication:
                    type: string

  /scanner/status:
    get:
      summary: Current scanner status
      responses:
        '200':
          description: Scanner status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'

  /scanner/device:
    get:
      summary: The scanner's own state, read from the device over SNMP
      description: >-
        Answered by `openskey status` (openskey ships in the image). Scanner objects only:
        whether the device lists this container as a Scan-to-PC destination, model, serial,
        firmware, the panel display line, and the network-scan / scan-key capability flags.
        Cached for DEVICE_STATUS_CACHE_SECONDS (default 10). DEVICE_STATUS=false turns it off.
      responses:
        '200':
          description: Device status (fields the model does not expose are null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatus'
        '404':
          description: Turned off (DEVICE_STATUS=false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /scanner/scanto:
    post:
      summary: Start a scan (returns immediately with the job id)
      security:
        - bearer: []
        - header: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [target]
              properties:
                target:
                  type: string
                  enum: [file, email, image, ocr]
                resolution:
                  type: integer
                  description: dpi, one of the values the device lists at startup; overrides RESOLUTION for this job
                mode:
                  type: string
                  description: scan mode as listed by the device, e.g. "True Gray"; overrides SCAN_MODE for this job
                source:
                  type: string
                  description: paper source as listed by the device; overrides SCAN_SOURCE for this job
                wait:
                  type: boolean
                  description: answer only when the scan script has finished
      responses:
        '200':
          description: Scan started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Invalid target or parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API token required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /scanner/scanto/{target}:
    get:
      summary: Start a scan and wait for the scan script to finish
      security:
        - bearer: []
        - header: []
      parameters:
        - in: path
          name: target
          required: true
          schema:
            type: string
            enum: [file, email, image, ocr]
        - in: query
          name: resolution
          schema:
            type: integer
        - in: query
          name: mode
          schema:
            type: string
        - in: query
          name: source
          schema:
            type: string
      responses:
        '200':
          description: Scan script finished (the conversion may still run in the background)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Invalid target or parameter
        '401':
          description: API token required

  /jobs:
    get:
      summary: Recent scan jobs, newest first
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        '200':
          description: Jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'

  /jobs/{id}:
    get:
      summary: State of one scan job
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}-\d{2}-\d{2}-\d{2}$'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid id
        '404':
          description: Unknown job

  /jobs/{id}/rear:
    post:
      summary: Scan the rear pages for a job that is waiting for them
      security:
        - bearer: []
        - header: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rear scan started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '401':
          description: API token required
        '404':
          description: Unknown job
        '409':
          description: Job is not waiting for rear pages

  /file-list:
    get:
      summary: List Scanned Files
      description: Newest first. Without limit the whole list is returned; with limit one page and X-Total-Count carries the total number of files.
      parameters:
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
          description: Index of the first entry to return (default 0)
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: Number of entries to return (default all)
      responses:
        '200':
          description: Returns a list of scanned files.
          headers:
            X-Total-Count:
              schema:
                type: integer
              description: Total number of files in the directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'

  /file/{file}/info:
    get:
      summary: Information about one file
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          description: Invalid name
        '404':
          description: File does not exist

  /file/{file}/thumbnail:
    get:
      summary: Thumbnail of the top third of the first page (640 x 302 JPEG, cached; placeholder SVG when the PDF cannot be rendered)
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image; ETag and long-lived Cache-Control headers; X-Thumbnail-Cache is hit, miss or placeholder (then X-Thumbnail-Error carries the reason)
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '304':
          description: Not modified (If-None-Match matched)
        '404':
          description: File does not exist or thumbnails disabled

  /file/{file}/download:
    get:
      summary: Download a file
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: File does not exist

  /file/{file}/rename:
    put:
      summary: Rename a file (requires ALLOW_GUI_FILEOPERATIONS=true)
      security:
        - bearer: []
        - header: []
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                new_filename:
                  type: string
                new_filename_prefix:
                  type: string
                  enum: [none, date, datetime]
      responses:
        '200':
          description: Renamed
        '400':
          description: Invalid name
        '401':
          description: API token required
        '403':
          description: File operations disabled

  /file/{file}/delete:
    delete:
      summary: Delete a file (requires ALLOW_GUI_FILEOPERATIONS=true)
      security:
        - bearer: []
        - header: []
      parameters:
        - in: path
          name: file
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: API token required
        '403':
          description: File operations disabled
        '404':
          description: File does not exist

  /settings/import-environment:
    post:
      summary: Copy every setting the environment sets into the configuration file (migration)
      description: The environment keeps winning until its entries are removed from the compose file and the container restarted; the file then carries on with the same values. Secrets are copied too. Requires ALLOW_GUI_SETTINGS=true and the API token when configured.
      responses:
        '200':
          description: Keys written, keys already in the file with the same value, all environment keys, a message, and the settings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  written:
                    type: array
                    items:
                      type: string
                  unchanged:
                    type: array
                    items:
                      type: string
                  environment:
                    type: array
                    items:
                      type: string
                  message:
                    type: string
                  config_file:
                    type: string
        '401':
          description: API token missing or wrong
        '403':
          description: Settings disabled
        '500':
          description: The file could not be written

  /settings:
    get:
      summary: All settings with value, source (environment, file, default), lock state and whether a change needs a restart
      description: Requires ALLOW_GUI_SETTINGS=true. Secrets are returned masked (is_set instead of value).
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_file:
                    type: string
                  config_file_exists:
                    type: boolean
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        group:
                          type: string
                        type:
                          type: string
                          enum: [string, int, float, bool, enum, secret]
                        default:
                          type: string
                        description:
                          type: string
                        restart:
                          type: boolean
                        value:
                          type: string
                        source:
                          type: string
                          enum: [environment, file, default]
                        locked:
                          type: boolean
        '403':
          description: Settings disabled
    put:
      summary: Change settings in the configuration file
      description: JSON object of setting names and values; an empty value removes the key from the file. Keys set by the environment are refused. Requires ALLOW_GUI_SETTINGS=true and the API token when configured.
      security:
        - bearer: []
        - header: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: array
                    items:
                      type: string
                  removed:
                    type: array
                    items:
                      type: string
                  restart_required:
                    type: array
                    items:
                      type: string
                  settings:
                    type: array
        '400':
          description: Invalid values (errors per key in the body)
        '401':
          description: API token required
        '403':
          description: Settings disabled

  /dev/timezone:
    get:
      summary: Time zone and current time of the backend
      responses:
        '200':
          description: Time zone information
          content:
            application/json:
              schema:
                type: object
                properties:
                  timezone:
                    type: string
                  datetime:
                    type: string
